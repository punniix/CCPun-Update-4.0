name: CCPun P0 Admin Release QA (isolated)
on:
  push:
    branches:
      - qa/p0-admin-release-20261020
permissions:
  contents: read
jobs:
  admin-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript strict compilation
        run: npx tsc --noEmit --incremental false
      - name: Audit protected baseline source drift without changing guards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const p = JSON.parse(readFileSync('qa/production-code-only-parity.json','utf8'));
          const records = {...p.canonical, ...p.protected, ...p.retainedVariants, ...p.workerEntrySources};
          const mismatches = [];
          for(const [file,digest] of Object.entries(records)) {
            if(!existsSync(file)) continue;
            const actual=createHash('sha256').update(readFileSync(file)).digest('hex');
            if(actual!==digest) mismatches.push({file,expected:digest,actual});
          }
          console.log('Protected baseline discrepancies:',mismatches.length,'of',Object.keys(records).length);
          for(const x of mismatches) console.log(JSON.stringify(x));
          NODE
      - name: Production foundation safety/parity
        run: npm run test:foundation-contracts
      - name: Publication and scheduling regression
        run: node --import tsx --test tests/admin/article-optimize-workflow.test.ts tests/admin/article-publish-action.test.ts tests/sitemap-google-regression.test.ts tests/admin/article-scheduling.test.ts tests/admin/article-schedule-executor.test.ts tests/admin/native-article-scheduler.test.ts
      - name: Sanity Studio security regression
        run: node --import tsx --test tests/admin/hostinger-studio-client.test.ts
