name: CCPun P0 Admin Release QA (isolated)
on:
  push:
    branches:
      - qa/p0-admin-release-20261020
permissions:
  contents: read
jobs:
  admin-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript strict compilation
        run: npx tsc --noEmit --incremental false
      - name: Production foundation safety/parity
        run: npm run test:foundation-contracts
      - name: Publication and scheduling regression
        run: node --import tsx --test tests/admin/article-optimize-workflow.test.ts tests/admin/article-publish-action.test.ts tests/sitemap-google-regression.test.ts tests/admin/article-scheduling.test.ts tests/admin/article-schedule-executor.test.ts tests/admin/native-article-scheduler.test.ts
      - name: Sanity Studio security regression
        run: node --import tsx --test tests/admin/hostinger-studio-client.test.ts
