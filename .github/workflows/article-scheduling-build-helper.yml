name: Article scheduling build helper

on:
  push:
    branches: [feature/free-plan-article-scheduling-20260911]
    paths: [.github/workflows/article-scheduling-build-helper.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Inspect installed framework documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('node_modules/next/dist/docs'), Path('node_modules/workflow/docs')]
          targets = []
          for root in roots:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix in ('.md', '.mdx') and (p.stem in ('route', 'route-handlers', 'sleep', 'start', 'with-workflow') or str(p).endswith('getting-started/next.mdx')):
                      targets.append(p)
          for p in sorted(targets):
              print('\n=== ' + str(p) + ' ===\n' + p.read_text()[:20000])
          for p in Path('node_modules/workflow/docs').rglob('*.mdx'):
              text = p.read_text()
              if 'maxRetries' in text:
                  idx = text.index('maxRetries')
                  print('\n=== RETRY: ' + str(p) + ' ===\n' + text[max(0, idx-800):idx+2200])
          PY
      - name: Export tracked source for scoped review
        run: git archive --format=tar.gz HEAD -o /tmp/scheduling-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: scheduling-source
          path: /tmp/scheduling-source.tar.gz
          retention-days: 1
