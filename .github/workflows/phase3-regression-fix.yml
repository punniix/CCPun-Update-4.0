name: Phase 3 Regression Owner Fix

on:
  pull_request:
    branches: [v4-production]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'audit/public-web-full-phase3-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Move heading assertion to current owner
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/vercel-native-regression.mjs')
          source = path.read_text()
          old = r"assert.match(articleBodyRenderer, /id=\{headingId\(index\)\}/);"
          new = "assert.match(articleBodyRenderer, /const id = headingIds\\.get\\(index\\)/);\nassert.match(articleBodyRenderer, /id=\\{id\\}/);"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one stale heading assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new))

      - name: Remove one-shot workflow
        run: rm .github/workflows/phase3-regression-fix.yml

      - name: Commit regression migration
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(blog): bind heading regression to current renderer"
          git push origin "HEAD:${HEAD_REF}"
