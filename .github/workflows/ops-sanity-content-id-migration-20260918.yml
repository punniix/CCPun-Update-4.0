name: One-time Production Sanity content ID migration

on:
  pull_request:
    branches: [v4-production]
    paths:
      - .github/workflows/ops-sanity-content-id-migration-20260918.yml

permissions:
  contents: read

concurrency:
  group: one-time-production-sanity-content-id-migration-20260918
  cancel-in-progress: false

jobs:
  migrate:
    if: github.head_ref == 'ops/sanity-content-id-migration-observable-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CCPUN_APP_ENV: local-production
      NEXT_PUBLIC_CCPUN_APP_ENV: local-production
      NEXT_PUBLIC_SANITY_PROJECT_ID: kyfxgjnq
      NEXT_PUBLIC_SANITY_DATASET: production
      SANITY_STUDIO_PROJECT_ID: kyfxgjnq
      SANITY_STUDIO_DATASET: production
      SANITY_API_TOKEN: ${{ secrets.SANITY_PRODUCTION_API_WRITE_TOKEN || secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_PRODUCTION_API_WRITE_TOKEN || secrets.SANITY_API_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Require Production Sanity write credential
        shell: bash
        run: |
          if [ -z "${SANITY_API_TOKEN:-}" ]; then
            echo "Production Sanity write credential is not configured in GitHub Actions." >&2
            exit 1
          fi
      - name: Preflight dry-run
        run: node --import tsx scripts/migrate-canonical-content-ids.ts --dry-run
      - name: Apply canonical IDs
        run: node --import tsx scripts/migrate-canonical-content-ids.ts --apply --confirm=CCPUN-CONTENT-ID-NORMALIZE-PRODUCTION
      - name: Verify idempotent zero-plan readback
        run: node --import tsx scripts/migrate-canonical-content-ids.ts --dry-run
