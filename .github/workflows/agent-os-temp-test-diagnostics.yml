name: Agent OS temporary test diagnostics

on:
  pull_request:
    branches: [v4-production]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose-tests:
    if: github.head_ref == 'admin/agent-os-foundation-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture Admin non-Social tests
        id: tests
        shell: bash
        run: |
          set +e
          mapfile -t files < <(find tests/admin -maxdepth 1 -type f -name '*.test.ts' ! -name 'social-*' | sort)
          node --import tsx --test "${files[@]}" > /tmp/admin-tests.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post diagnostics
        if: steps.tests.outputs.exit != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/admin-tests.log','utf8').slice(-24000);
            const marker = '<!-- agent-os-temp-test-diagnostics -->';
            const fence = String.fromCharCode(96).repeat(3);
            const body = marker + '\n## Agent OS temporary test diagnostics\n\n' + fence + 'text\n' + log + '\n' + fence;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: Fail when tests fail
        if: steps.tests.outputs.exit != '0'
        run: exit 1
