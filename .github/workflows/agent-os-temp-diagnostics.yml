name: Agent OS temporary diagnostics

on:
  pull_request:
    branches: [v4-production]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'admin/agent-os-foundation-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture lint
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture Admin typecheck
        id: tsc
        shell: bash
        run: |
          set +e
          npm run typecheck:admin:shadow > /tmp/tsc.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post diagnostics
        if: steps.lint.outputs.exit != '0' || steps.tsc.outputs.exit != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const lint = fs.readFileSync('/tmp/lint.log','utf8').slice(-12000);
            const tsc = fs.readFileSync('/tmp/tsc.log','utf8').slice(-12000);
            const marker = '<!-- agent-os-temp-diagnostics -->';
            const fence = String.fromCharCode(96).repeat(3);
            const body = marker + '\n## Agent OS temporary diagnostics\n\n### ESLint\n' + fence + 'text\n' + lint + '\n' + fence + '\n\n### Admin TypeScript\n' + fence + 'text\n' + tsc + '\n' + fence;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
      - name: Fail when diagnostics fail
        if: steps.lint.outputs.exit != '0' || steps.tsc.outputs.exit != '0'
        run: exit 1
