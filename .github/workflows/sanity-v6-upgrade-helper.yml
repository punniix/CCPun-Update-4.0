name: Sanity v6 upgrade helper

on:
  push:
    branches:
      - chore/sanity-v6-upgrade-20260911
    paths:
      - .github/workflows/sanity-v6-upgrade-helper.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Upgrade Sanity Studio core and direct UI dependency
        run: npm install --save-dev sanity@^6.13.1 @sanity/ui@^4.2.1

      - name: Show resolved Sanity stack
        run: npm ls sanity @sanity/ui next-sanity @sanity/client react react-dom

      - name: Foundation checks
        run: npm run check:foundation

      - name: Production-parity build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit regenerated dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Sanity Studio to v6"
          git push origin HEAD:chore/sanity-v6-upgrade-20260911
