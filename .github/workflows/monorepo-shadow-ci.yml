name: CCPun Monorepo Shadow CI

on:
  pull_request:
    branches: [v4-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpun-monorepo-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify native app-root contract
        run: node --test tests/hostinger-native-app-contract.test.mjs
      - name: LINE webhook privacy and crawler contracts
        run: node --import tsx --test tests/line-webhook-ingress.test.ts
      - name: Typecheck Web shadow
        run: npm run typecheck:web:shadow
      - name: Build Web shadow
        run: npm run build:web:shadow
        env:
          CCPUN_DEPLOYMENT_PROVIDER: hostinger
          CCPUN_DEPLOYMENT_ROLE: web
          CCPUN_RELEASE_STAGE: shadow
          CCPUN_APP_ENV: web-uat
          NEXT_PUBLIC_CCPUN_APP_ENV: web-uat
          CCPUN_UAT_MODE: "1"
          CCPUN_ENABLE_PRODUCTION_ANALYTICS: "0"
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat

  admin-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Full local build; sealed native-Neon acceptance has separate gates.
      - name: Typecheck Admin shadow
        run: npm run typecheck:admin:shadow
        env:
          CCPUN_DEPLOYMENT_PROVIDER: local
          CCPUN_DEPLOYMENT_ROLE: admin
          CCPUN_APP_ENV: local-uat
          NEXT_PUBLIC_CCPUN_APP_ENV: local-uat
          CCPUN_ADMIN_CAPABILITY_PROFILE: full
          NEXT_PUBLIC_CCPUN_ADMIN_CAPABILITY_PROFILE: full
          CCPUN_UAT_MODE: "1"
          CCPUN_ENABLE_PRODUCTION_ANALYTICS: "0"
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat
          SANITY_STUDIO_PROJECT_ID: ccb9lnw5
          SANITY_STUDIO_DATASET: uat
          AUTH_URL: http://127.0.0.1:3100
          CCPUN_ADMIN_OWNER_EMAILS: owner@example.invalid
      - name: Build Admin shadow
        run: npm run build:admin:shadow
        env:
          CCPUN_DEPLOYMENT_PROVIDER: local
          CCPUN_DEPLOYMENT_ROLE: admin
          CCPUN_APP_ENV: local-uat
          NEXT_PUBLIC_CCPUN_APP_ENV: local-uat
          CCPUN_ADMIN_CAPABILITY_PROFILE: full
          NEXT_PUBLIC_CCPUN_ADMIN_CAPABILITY_PROFILE: full
          CCPUN_UAT_MODE: "1"
          CCPUN_ENABLE_PRODUCTION_ANALYTICS: "0"
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat
          SANITY_STUDIO_PROJECT_ID: ccb9lnw5
          SANITY_STUDIO_DATASET: uat
          AUTH_URL: http://127.0.0.1:3100
          CCPUN_ADMIN_OWNER_EMAILS: owner@example.invalid
