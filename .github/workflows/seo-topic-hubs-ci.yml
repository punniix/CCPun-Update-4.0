name: CCPun Foundation CI

on:
  push:
    branches: [v4-production]
  pull_request:
    branches: [v4-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpun-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Foundation code, SEO, analytics and admin contracts
        run: npm run check:foundation

      - name: FHC and CI calculator regression gate
        run: |
          node --import tsx tests/calculator-regression.ts
          node --test tests/calculator-design-language.test.mjs
          node --test tests/calculator-ux-formula-parity.test.mjs
          node --test tests/calculator-ux-journey.test.mjs
          node --import tsx tests/result-actions-regression.ts
          node tests/fhc-seo-geo-regression.mjs

      - name: FHC and CI exhaustive browser QA
        shell: bash
        env:
          CCPUN_UAT_MODE: "1"
          CCPUN_APP_ENV: development
          NEXT_PUBLIC_CCPUN_APP_ENV: development
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat
          SANITY_STUDIO_PROJECT_ID: ccb9lnw5
          SANITY_STUDIO_DATASET: uat
          AUTH_URL: http://127.0.0.1:3005
        run: |
          set -euo pipefail
          npx next dev --hostname 127.0.0.1 --port 3005 > /tmp/ccpun-calculator-browser-next.log 2>&1 &
          SERVER_PID=$!
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium is required for exhaustive browser QA.' >&2
            exit 1
          fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9342 about:blank > /tmp/ccpun-calculator-browser-chrome.log 2>&1 &
          CHROME_PID=$!
          cleanup() {
            kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3005/tools/financial-health-check/ >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:3005/ci-planning/ >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:9342/json/version >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Calculator browser QA server exited before becoming ready.' >&2
              cat /tmp/ccpun-calculator-browser-next.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Timed out waiting for calculator browser QA runtime.' >&2
            cat /tmp/ccpun-calculator-browser-next.log
            cat /tmp/ccpun-calculator-browser-chrome.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3005/tools/financial-health-check/ > /tmp/fhc-cloud.html
          curl --fail --silent --show-error -D /tmp/fhc-cloud.headers -o /dev/null http://127.0.0.1:3005/tools/financial-health-check/
          curl --fail --silent --show-error http://127.0.0.1:3005/robots.txt > /tmp/fhc-cloud.robots
          CLOUD_HTML_PATH=/tmp/fhc-cloud.html \
          CLOUD_HEADERS_PATH=/tmp/fhc-cloud.headers \
          CLOUD_ROBOTS_PATH=/tmp/fhc-cloud.robots \
          UAT_BASE_URL=http://127.0.0.1:3005 \
          CDP_HTTP=http://127.0.0.1:9342 \
          node qa/fhc-exhaustive-uat.mjs

          UAT_BASE_URL=http://127.0.0.1:3005 \
          CDP_HTTP=http://127.0.0.1:9342 \
          node qa/ci-exhaustive-uat.mjs

      - name: Google sitemap deterministic contract
        run: node --import tsx --test tests/sitemap-google-regression.test.ts

      - name: Homepage LCP loading contract
        run: node tests/home-lcp-regression.mjs

      # Production health is a post-merge verification. Running it on a PR makes
      # incident fixes impossible to merge when the currently deployed version is
      # the thing that is unhealthy. Keep it blocking on v4-production pushes.
      - name: Live legacy URL ledger against Production
        if: github.event_name != 'pull_request'
        run: npm run qa:legacy-urls

      - name: SEO topic hub static contract
        run: node tests/seo-topic-hubs-regression.mjs

      - name: SEO and homepage HTTP contracts on read-only Production content
        shell: bash
        run: |
          npm run local:production:read > /tmp/ccpun-seo-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/blog/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Local read-only Production server exited before becoming ready.'
              cat /tmp/ccpun-seo-http.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Timed out waiting for local read-only Production server.'
            cat /tmp/ccpun-seo-http.log
            exit 1
          fi

          node qa/seo-topic-hubs-http-regression.mjs
          node qa/sitemap-google-http-regression.mjs
          node qa/home-lcp-http-regression.mjs

      - name: Production-parity build on non-production content lane
        run: npm run build
        env:
          CCPUN_APP_ENV: development
          NEXT_PUBLIC_CCPUN_APP_ENV: development
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat

  promote-admin:
    name: Promote Admin after verified push
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/v4-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Require Vercel promotion credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN repository secret is required for automated Admin promotion.' >&2
            exit 1
          fi

      - name: Promote exact Admin deployment for verified commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CCPUN_ADMIN_PROJECT_ID: prj_6tuUxJxYbQ4mpF7sMgNWx2p2jowN
          VERCEL_TEAM_ID: team_GbcO71LS2dLHwiBV6Cs39Kax
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/promote-admin-after-ci.mjs
