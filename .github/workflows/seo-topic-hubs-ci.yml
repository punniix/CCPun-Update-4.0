name: CCPun Foundation CI

on:
  push:
    branches: [v4-production]
  pull_request:
    branches: [v4-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpun-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Foundation code, SEO, analytics and admin contracts
        run: npm run check:foundation

      - name: Google sitemap deterministic contract
        run: node --import tsx --test tests/sitemap-google-regression.test.ts

      - name: Homepage LCP loading contract
        run: node tests/home-lcp-regression.mjs

      # Production health is a post-merge verification. Running it on a PR makes
      # incident fixes impossible to merge when the currently deployed version is
      # the thing that is unhealthy. Keep it blocking on v4-production pushes.
      - name: Live legacy URL ledger against Production
        if: github.event_name != 'pull_request'
        run: npm run qa:legacy-urls

      - name: SEO topic hub static contract
        run: node tests/seo-topic-hubs-regression.mjs

      - name: SEO and homepage HTTP contracts on read-only Production content
        shell: bash
        run: |
          npm run local:production:read > /tmp/ccpun-seo-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/blog/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Local read-only Production server exited before becoming ready.'
              cat /tmp/ccpun-seo-http.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Timed out waiting for local read-only Production server.'
            cat /tmp/ccpun-seo-http.log
            exit 1
          fi

          node qa/seo-topic-hubs-http-regression.mjs
          node qa/sitemap-google-http-regression.mjs
          node qa/home-lcp-http-regression.mjs

      - name: Production-parity build on non-production content lane
        run: npm run build
        env:
          CCPUN_APP_ENV: development
          NEXT_PUBLIC_CCPUN_APP_ENV: development
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat

  promote-admin:
    name: Promote Admin after verified push
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/v4-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Vercel promotion credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN repository secret is required for automated Admin promotion.' >&2
            exit 1
          fi

      - name: Promote exact Admin deployment for verified commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CCPUN_ADMIN_PROJECT_ID: prj_6tuUxJxYbQ4mpF7sMgNWx2p2jowN
          VERCEL_TEAM_ID: team_GbcO71LS2dLHwiBV6Cs39Kax
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/promote-admin-after-ci.mjs
