name: CCPun Agent Scope Guard

# Flags (warn) / fails (enforce) new branches outside the agent allowlist, moved Hostinger release pins and
# agent PRs without a matching Task-ID. Legacy branches are grandfathered (warning only).
# Inventory runs weekly and never deletes anything.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Owner decision R3 (2026-10-25): WARN for a one-week burn-in, then enforce.
  # TODO(2026-11-01): switch AGENT_GUARD_MODE to "enforce", then mark the
  # "branch-name" and "pull-request-scope" checks as required on v4-production.
  # The GitHub ruleset "Restrict creations" is enabled only after that enforce week.
  AGENT_GUARD_MODE: warn

jobs:
  branch-name:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/agent-guard.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Check pushed branch against the agent allowlist
        env:
          REF_NAME: ${{ github.ref_name }}
          CREATED: ${{ github.event.created }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set --
          if [ "$CREATED" = "true" ]; then set -- --created; fi
          node scripts/agent-guard.mjs check-branch "$REF_NAME" --head "$HEAD_SHA" --mode "$AGENT_GUARD_MODE" "$@"

  pull-request-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            scripts/agent-guard.mjs
            tests/agent-guard.test.mjs
            .github/workflows/agent-scope-guard.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Guard self-test (kept out of package.json, which is a pinned Production contract)
        run: node --test tests/agent-guard.test.mjs
      - name: Check PR head, base and Task-ID
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/agent-guard.mjs check-pr --mode "$AGENT_GUARD_MODE"

  inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/agent-guard.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Report branch and release-pin inventory (read-only)
        run: node scripts/agent-guard.mjs report --remote --ci
