name: CCPun Vercel Monorepo Migration Audit

on:
  push:
    branches: [architecture/vercel-monorepo-isolation-20260917]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpun-vercel-monorepo-migration-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Audit runtime import and environment ownership
        run: node scripts/audit-monorepo-boundaries.mjs

      - name: Require Vercel audit credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN repository secret is required for Vercel migration audit.' >&2
            exit 1
          fi

      - name: Audit locked Vercel project settings and environment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_GbcO71LS2dLHwiBV6Cs39Kax
        shell: bash
        run: |
          node <<'NODE'
          const projects = [
            { role: 'web', id: 'prj_dxwjITkd0av5QiJQv2snUlIASUWu', name: 'ccpun-web' },
            { role: 'admin', id: 'prj_6tuUxJxYbQ4mpF7sMgNWx2p2jowN', name: 'ccpun-admin' },
          ];
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

          async function firstJson(candidates) {
            const attempts = [];
            for (const candidate of candidates) {
              const response = await fetch(candidate.url, { headers, redirect: 'error' });
              attempts.push({ label: candidate.label, status: response.status });
              if (response.ok) return { payload: await response.json(), selected: candidate.label, attempts };
            }
            return { payload: null, selected: null, attempts };
          }

          const output = [];
          const drift = [];
          const unavailable = [];

          for (const project of projects) {
            const scoped = `teamId=${encodeURIComponent(teamId)}`;
            const settingsResult = await firstJson([
              { label: 'id+team', url: `https://api.vercel.com/v9/projects/${project.id}?${scoped}` },
              { label: 'name+team', url: `https://api.vercel.com/v9/projects/${project.name}?${scoped}` },
              { label: 'id', url: `https://api.vercel.com/v9/projects/${project.id}` },
              { label: 'name', url: `https://api.vercel.com/v9/projects/${project.name}` },
            ]);
            const envResult = await firstJson([
              { label: 'id+team', url: `https://api.vercel.com/v10/projects/${project.id}/env?${scoped}&decrypt=false` },
              { label: 'name+team', url: `https://api.vercel.com/v10/projects/${project.name}/env?${scoped}&decrypt=false` },
              { label: 'id', url: `https://api.vercel.com/v10/projects/${project.id}/env?decrypt=false` },
              { label: 'name', url: `https://api.vercel.com/v10/projects/${project.name}/env?decrypt=false` },
            ]);
            const settings = settingsResult.payload;
            const envs = Array.isArray(envResult.payload?.envs) ? envResult.payload.envs : [];

            if (!settings || !envResult.selected) {
              unavailable.push({
                role: project.role,
                settingsAttempts: settingsResult.attempts,
                envAttempts: envResult.attempts,
              });
            }

            if (settings) {
              if (settings.name !== project.name) drift.push(`${project.role}: unexpected project name ${settings.name}`);
              if (settings.framework !== 'nextjs') drift.push(`${project.role}: framework is ${settings.framework ?? 'null'}, expected nextjs`);
              if (settings.nodeVersion !== '24.x') drift.push(`${project.role}: Node is ${settings.nodeVersion ?? 'null'}, expected 24.x`);
              if (settings.link?.type !== 'github' || settings.link?.repo !== 'CCPun-Update-4.0' || settings.link?.org !== 'punniix') {
                drift.push(`${project.role}: Git repository linkage drifted`);
              }
            }

            output.push({
              role: project.role,
              projectId: project.id,
              auditStatus: settings && envResult.selected ? 'available' : 'credential-scope-unavailable',
              projectLookup: { selected: settingsResult.selected, attempts: settingsResult.attempts },
              envLookup: { selected: envResult.selected, attempts: envResult.attempts },
              settings: settings ? {
                name: settings.name,
                framework: settings.framework,
                nodeVersion: settings.nodeVersion,
                rootDirectory: settings.rootDirectory ?? null,
                buildCommand: settings.buildCommand ?? null,
                installCommand: settings.installCommand ?? null,
                outputDirectory: settings.outputDirectory ?? null,
                devCommand: settings.devCommand ?? null,
                commandForIgnoringBuildStep: settings.commandForIgnoringBuildStep ?? null,
                sourceFilesOutsideRootDirectory: settings.sourceFilesOutsideRootDirectory ?? null,
                productionBranch: settings.link?.productionBranch ?? settings.productionBranch ?? null,
                gitRepository: settings.link ? {
                  type: settings.link.type ?? null,
                  repo: settings.link.repo ?? null,
                  org: settings.link.org ?? null,
                  repoId: settings.link.repoId ?? null,
                } : null,
              } : null,
              environmentKeys: [...new Set(envs.map((item) => item.key))].sort(),
              environmentEntryCount: envs.length,
            });
          }

          console.log('CCPUN_VERCEL_PROJECT_AUDIT_START');
          console.log(JSON.stringify(output, null, 2));
          console.log('CCPUN_VERCEL_PROJECT_AUDIT_END');

          for (const item of unavailable) {
            console.log(`::warning title=Vercel audit credential scope::${item.role} project metadata is not visible to the repository VERCEL_TOKEN. Live migration QA must verify this project with an authorized Vercel connection before cutover.`);
          }

          if (drift.length) {
            for (const message of drift) console.error(`::error title=Vercel project drift::${message}`);
            throw new Error('VERCEL_PROJECT_CONFIGURATION_DRIFT');
          }
          NODE
