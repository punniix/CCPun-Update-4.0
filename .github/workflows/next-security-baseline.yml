name: CCPun Next.js Security Baseline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [v4-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Reject vulnerable or mismatched dependency versions
        run: node scripts/check-next-security-baseline.mjs
