services:
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_models:/root/.ollama
    networks: [model_private]
    mem_limit: 5500m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 20

  model-init:
    image: ollama/ollama:0.34.0
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, qwen3:1.7b]
    volumes:
      - ollama_models:/root/.ollama
    networks: [model_private]
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: workers/local-ai/Dockerfile
    restart: unless-stopped
    env_file: .env.local-ai
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/
      OLLAMA_MODEL: qwen3:1.7b
      CCPUN_LOCAL_AI_PRIVATE_JOBS_ENABLED: "false"
    networks: [model_private, egress]
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp:size=32m,noexec,nosuid]
    security_opt: [no-new-privileges:true]
    depends_on:
      model-init:
        condition: service_completed_successfully

  ocr-model-init:
    profiles: ["ocr"]
    build:
      context: ../..
      dockerfile: workers/local-ai/ocr/Dockerfile
    restart: "no"
    command: ["python", "/app/preload.py"]
    environment:
      HOME: /home/ocr
      PADDLE_PDX_MODEL_SOURCE: BOS
    volumes:
      - ocr_models:/home/ocr/.paddlex
    networks: [egress]
    mem_limit: 1400m
    cpus: "1.0"
    security_opt: [no-new-privileges:true]

  ocr:
    profiles: ["ocr"]
    build:
      context: ../..
      dockerfile: workers/local-ai/ocr/Dockerfile
    restart: unless-stopped
    env_file: .env.local-ai
    environment:
      HOME: /home/ocr
      PADDLE_PDX_MODEL_SOURCE: BOS
      OCR_MAX_BYTES: "8388608"
      OCR_MAX_SIDE: "2400"
      OCR_TIMEOUT_SECONDS: "90"
      OCR_MIN_SCORE: "0.35"
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8788", "--workers", "1", "--no-access-log"]
    volumes:
      - ocr_models:/home/ocr/.paddlex:ro
    networks: [model_private]
    ports:
      - "127.0.0.1:8788:8788"
    mem_limit: 1200m
    cpus: "1.0"
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt: [no-new-privileges:true]
    depends_on:
      ocr-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  model_private:
    internal: true
  egress: {}

volumes:
  ollama_models: {}
  ocr_models: {}
