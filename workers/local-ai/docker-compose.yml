services:
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_models:/root/.ollama
    networks: [model_private]
    mem_limit: 5500m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 20

  model-init:
    image: ollama/ollama:0.34.0
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, qwen3:1.7b]
    volumes:
      - ollama_models:/root/.ollama
    networks: [model_private]
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: workers/local-ai/Dockerfile
    restart: unless-stopped
    env_file: .env.local-ai
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/
      OLLAMA_MODEL: qwen3:1.7b
      CCPUN_LOCAL_AI_PRIVATE_JOBS_ENABLED: "false"
    networks: [model_private, egress]
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp:size=32m,noexec,nosuid]
    security_opt: [no-new-privileges:true]
    depends_on:
      model-init:
        condition: service_completed_successfully

networks:
  model_private:
    internal: true
  egress: {}

volumes:
  ollama_models: {}
